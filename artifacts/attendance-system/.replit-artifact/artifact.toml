kind = "web"
previewPath = "/"
title = "نظام إدارة الحضور والانصراف"
version = "1.0.0"
id = "artifacts/attendance-system"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 24620
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/attendance-system run dev"

[services.env]
PORT = "24620"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/attendance-system", "run", "build"]
publicDir = "artifacts/attendance-system/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
